name: Diag billing_e2e py3.11 stall
# fork-only diagnostic (agarg21/ci-agent): why 10 billing_e2e SDK tests take ~62 s each on 3.11 and ~2 s on 3.12
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
    working-directory: autogpt_platform/backend
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true
      PLAIN_OUTPUT: True
      RUN_ENV: local
      PYTHONASYNCIODEBUG: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: |
          V=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
          curl -sSL https://install.python-poetry.org | POETRY_VERSION=$V python3 -
      - run: poetry install
      - run: poetry run prisma generate && poetry run gen-prisma-stub
      - name: billing_e2e with stack dumps
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
          export ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')
          poetry run pytest -c pyproject.toml backend/copilot/billing_e2e -p no:cacheprovider \
            -o faulthandler_timeout=25 --durations=20 -rA -q \
            -k "sdk-openrouter and not no-reconcile and thread_billing" || true
